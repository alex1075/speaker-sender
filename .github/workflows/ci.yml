name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install OpenSSL (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install openssl@3
      - run: make
      - name: Unit, mock-receiver and command line tests
        run: make check

  c-sanitizers:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build and test with AddressSanitizer and UBSan
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: detect_leaks=0
        run: make check

  c-vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate reference vectors with pyatv/srptools and compare
        run: |
          pip install pyatv srptools cryptography
          python c/tools/gen_vectors.py > /tmp/vectors.h
          diff -u c/tests/vectors.h /tmp/vectors.h

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
